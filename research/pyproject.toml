[project]
name = "wealthpilot-lab"
version = "0.1.0"
description = "Research package for WealthPilot: synthetic applicants, reference engine, ground truth and the evaluation experiments."
requires-python = ">=3.12"
dependencies = [
    "wealthpilot",
    "fairlearn>=0.15.0",
    "reportlab>=5.1.0",
]

[tool.uv.sources]
wealthpilot = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
