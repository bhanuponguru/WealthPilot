services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wealthpilot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wealthpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wealthpilot}
      POSTGRES_DB: ${POSTGRES_DB:-wealthpilot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wealthpilot}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768m

volumes:
  pgdata:

# MLflow and the MCP servers run from the uv venv during development
# (`uv run mlflow server ...`, see Makefile) to keep memory use low on the
# 5.8 GB WSL VM. They can be containerised later if needed.
