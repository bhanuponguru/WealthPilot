site_name: WealthPilot
site_description: A multi-agent assistant for small-business loan underwriting, with policy retrieval, deterministic credit tools, mandatory human approval and a tamper-evident audit trail.
docs_dir: docs
site_dir: site
use_directory_urls: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/git-alt

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Home: index.md
  - Get started:
      - Deploy with Docker: get-started/deploy.md
      - Your first case: get-started/first-case.md
      - Configuration: get-started/configuration.md
  - User guide:
      - Using the console: user-guide/console.md
      - Command-line interface: user-guide/cli.md
  - Administration:
      - Operations: administration/operations.md
      - Managing credit policies: administration/policies.md
      - Security and access: administration/security.md
      - Troubleshooting: administration/troubleshooting.md
      - Known limitations: administration/limitations.md
  - Architecture:
      - architecture/index.md
      - System design: architecture/system-design.md
      - The underwriting workflow: architecture/workflow.md
      - Agents and tools: architecture/agents.md
      - The decision rule: architecture/decision-rule.md
      - Policy retrieval: architecture/policy-retrieval.md
      - Document parsing: architecture/document-parsing.md
      - Risk model: architecture/risk-model.md
      - Memory: architecture/memory.md
      - Compliance and human approval: architecture/compliance.md
      - Model gateway and reliability: architecture/model-gateway.md
      - Tool servers: architecture/tool-servers.md
      - Observability: architecture/observability.md
      - The console: architecture/console.md
      - Design decisions: architecture/decisions.md
      - Developer guide: architecture/development.md
  - Reference:
      - reference/index.md
      - Tool reference: reference/tool-reference.md
      - Case state: reference/case-state.md
      - Database: reference/database.md
      - Policy rules: reference/policy-rules.md
      - Glossary: reference/glossary.md
  - Research:
      - research/index.md
      - Synthetic data: research/synthetic-data.md
      - "E0 Policy adherence": research/e0-policy-adherence.md
      - "E1 Document parsing": research/e1-parsing.md
      - "E2 Policy retrieval": research/e2-rag.md
      - "E3 Fairness and compliance": research/e3-fairness.md
      - "E4 Reliability": research/e4-reliability.md
      - Limits of the evaluation: research/limitations.md
      - Reproducing the experiments: research/reproduce.md
